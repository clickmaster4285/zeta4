# /etc/nginx/sites-available/zetatech.com.pk
# Reverse proxy for the Next.js server managed by PM2 on 127.0.0.1:3000.
# After `certbot --nginx` runs it will add the SSL server block automatically.

upstream zeta_web {
  server 127.0.0.1:3000;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name zetatech.com.pk www.zetatech.com.pk;

  # Allow large enough bodies for the contact form, nothing more.
  client_max_body_size 1m;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 1024;

  # Hashed build assets — cache for a year.
  location /_next/static/ {
    proxy_pass http://zeta_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    proxy_pass http://zeta_web;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }
}
